services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el entorno}
    ports:
      - "1433:1433"
    volumes:
      - pedidos_sql_data:/var/opt/mssql

volumes:
  pedidos_sql_data:
